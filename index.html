<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cifras e Galeria - Banda</title>
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    /* Estilos base (Mantidos) */
    .player-pratica-container { background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 12px; margin-top: 15px; margin-bottom: 20px; box-shadow: 0 1px 2px rgba(0,0,0,0.05); }
    .player-acoes { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
    .player-botoes { display: flex; align-items: center; gap: 12px; }
    .btn-acao-audio { background: #e2e8f0; border: none; width: 34px; height: 34px; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #334155; cursor: pointer; transition: background 0.2s; }
    .btn-acao-audio:hover { background: #cbd5e1; }
    .btn-play-principal { background: #4f46e5; color: white; width: 44px; height: 44px; border-radius: 50%; border: none; display: flex; align-items: center; justify-content: center; cursor: pointer; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3); }
    .player-timeline { display: flex; align-items: center; gap: 8px; }
    .tempo-audio { font-size: 11px; color: #64748b; font-weight: 500; width: 38px; text-align: center; }

    /* ================= NOVOS ESTILOS PARA O PAD ================= */
    .modal-pad-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: rgba(0,0,0,0.5); display: none; justify-content: center; align-items: center; z-index: 2000;
      backdrop-filter: blur(2px);
    }
    .modal-pad-overlay.ativo { display: flex; }
    .modal-pad-box {
      background: white; border-radius: 16px; padding: 20px; width: 90%; max-width: 320px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.2); animation: slideUpPad 0.3s ease;
    }
    @keyframes slideUpPad { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    
    .grid-tons-pad { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 15px; }
    .btn-tom-pad {
      background: #f1f5f9; border: 1px solid #e2e8f0; padding: 12px 0; border-radius: 8px;
      font-weight: bold; color: #334155; cursor: pointer; transition: 0.2s; font-size: 14px;
    }
    .btn-tom-pad:hover { background: #e2e8f0; }
    .btn-tom-pad.ativo { background: #4f46e5; color: white; border-color: #4f46e5; box-shadow: 0 2px 4px rgba(79, 70, 229, 0.3); }
    
    .lista-pads-menu { display: flex; flex-direction: column; gap: 8px; margin-top: 15px; max-height: 250px; overflow-y: auto; }
    .btn-lista-pad {
      text-align: left; background: #f8fafc; border: 1px solid #e2e8f0; padding: 12px 16px;
      border-radius: 8px; font-weight: 500; color: #334155; cursor: pointer; display: flex; justify-content: space-between;
    }
    .btn-lista-pad:hover { background: #e2e8f0; }
    
    .controle-volume-pad { display: flex; align-items: center; gap: 10px; margin-top: 20px; }
    .pad-btn-ativo { background: #10b981 !important; color: white !important; border-color: #10b981 !important; } /* Verde para mostrar que está tocando */
  </style>

  <style>
    /* 1. Reduz o espaço entre o limite da página (tela do celular/PC) e o bloco branco */
    .container {
      padding-left: 8px !important;
      padding-right: 8px !important;
    }

    /* 2. Reduz o espaço interno entre o texto das cifras/letras e a borda do bloco branco */
    #cifraConteudo {
      padding: 10px !important; /* Reduz a margem interna */
      margin-left: 0 !important;
      margin-right: 0 !important;
    }
  </style>

</head>
<body>

  <!-- Modal Admin / Menu -->
  <div id="modalAdmin" class="modal-overlay">
    <div class="modal-box">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <h3 style="margin: 0;">Menu</h3>
        <button class="icon-btn" onclick="fecharModal()"><span class="material-icons-round">close</span></button>
      </div>
      <button class="btn btn-primary" style="width: 100%; justify-content: center; margin-bottom: 20px;" onclick="fecharModal(); window.location.hash='#/galeria';">
        <span class="material-icons-round" style="font-size: 18px;">photo_library</span> Ver Galeria de Mídia
      </button>
      <hr style="border: 0; border-top: 1px solid #e5e7eb; margin-bottom: 20px;">
      <h3 style="font-size: 16px;">Área Admin</h3>
      <p style="font-size: 13px; color: #6b7280;">Digite a senha para gerenciar repertório, mídias e Pads</p>
      <input type="password" id="inputSenhaAdmin" class="input-moderno" placeholder="••••••••" onkeydown="tratarEnterModal(event)">
      <div class="modal-actions" style="margin-top: 15px;">
        <button class="btn" onclick="fecharModal()">Cancelar</button>
        <button class="btn btn-primary" onclick="verificarSenhaAdmin()">Entrar</button>
      </div>
    </div>
  </div>

  <!-- Modais do Sistema de PAD -->
  <div id="modalPadSelecao" class="modal-pad-overlay" onclick="fecharModaisPad(event)">
    <div class="modal-pad-box" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <h3 style="margin: 0; font-size: 18px;">Escolher Pad</h3>
        <button class="icon-btn" onclick="fecharModaisPad(true)"><span class="material-icons-round">close</span></button>
      </div>
      <div class="lista-pads-menu" id="listaPadsModal">
        <!-- Injetado via JS -->
      </div>
    </div>
  </div>

  <div id="modalPadAtivo" class="modal-pad-overlay" onclick="fecharModaisPad(event)">
    <div class="modal-pad-box" onclick="event.stopPropagation()">
      <div style="display: flex; justify-content: space-between; align-items: center;">
        <div>
          <h3 style="margin: 0; font-size: 16px; color: #4f46e5; display: flex; align-items: center; gap: 5px;">
            <span class="material-icons-round" style="font-size: 18px;">keyboard</span> <span id="nomePadAtivoUI">Pad</span>
          </h3>
        </div>
        <button class="icon-btn" onclick="fecharModaisPad(true)"><span class="material-icons-round">close</span></button>
      </div>
      
      <!-- Grid de Tons (C a B sustenidos) -->
      <div class="grid-tons-pad" id="gridTonsPad">
        <!-- Injetado via JS -->
      </div>

      <!-- Controle de Volume -->
      <div class="controle-volume-pad">
        <span class="material-icons-round" style="color: #64748b;">volume_down</span>
        <input type="range" class="slider-moderno" id="sliderVolumePad" min="0" max="1" step="0.05" value="0.5" oninput="ajustarVolumePadGlobal(this.value)" style="flex: 1;">
        <span class="material-icons-round" style="color: #64748b;">volume_up</span>
      </div>

      <button class="btn" style="width: 100%; margin-top: 20px; background: #ef4444; color: white;" onclick="pararPad()">
        <span class="material-icons-round">stop</span> Parar Pad
      </button>
    </div>
  </div>

  <header class="navbar">
    <div class="nav-left">
      <button class="icon-btn" onclick="abrirModal()"><span class="material-icons-round">menu</span></button>
      <div class="brand">
        <div class="logo-icon"><span class="material-icons-round">music_note</span></div>
        <div class="brand-text"><h1>Cifras</h1><span>Repertório da Banda</span></div>
      </div>
    </div>
  </header>

  <main class="container" id="app">
    <p style="text-align: center; margin-top: 50px; color: #6b7280;">Carregando dados...</p>
  </main>

  <script>
    let dadosApp = { cifras: [], galeria: [], pads: [] }; // Adicionado 'pads' ao estado principal
    let tomAtual = '';
    let conteudoOriginal = '';
    let musicaTomOriginal = '';
    let intervalRolagem = null;
    let tamanhoFonteAtual = 16;
    let termoBuscaAtual = '';

    // ==========================================
    // SISTEMA DE PAD (COM CROSSFADE SUAVE E LOOP)
    // ==========================================
    
    // Usamos dois canais para fazer a transição de um para o outro
    let audioPad1 = new Audio();
    let audioPad2 = new Audio();
    
    // Essa é a mágica que faz o áudio de 8 minutos se repetir para sempre sem parar
    audioPad1.loop = true;
    audioPad2.loop = true;

    let canalAtivo = 1; // Controla qual canal está tocando no momento
    let padGlobalVolume = 0.5;
    let isPadPlaying = false;
    let currentPadId = null;
    let currentPadTom = null;
    
    // Controles de tempo para a transição suave
    let fadeInterval1 = null;
    let fadeInterval2 = null;

    const TONS_PAD = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];

    // Converte links do Dropbox ou Google Drive para streaming direto
    function obterLinkDireto(url) {
      if (!url) return '';
      if (url.includes('dropbox.com')) {
        return url.replace('dl=0', 'raw=1').replace('?dl=0', '?raw=1');
      }
      const matchId = url.match(/\/d\/(.+?)\//) || url.match(/id=(.+?)(&|$)/);
      if (matchId && matchId[1]) {
        return `https://drive.google.com/uc?export=download&id=${matchId[1]}`;
      }
      return url;
    }

    // Função LEVE que abaixa o volume aos poucos sem travar o site
    function fazerFadeOut(audio, numCanal) {
      let intervalId = numCanal === 1 ? fadeInterval1 : fadeInterval2;
      if (intervalId) clearInterval(intervalId); // Limpa qualquer fade anterior

      let volAtual = audio.volume;
      if (volAtual <= 0 || audio.paused) return; 

      let step = volAtual / 20; // Divide a descida do volume em 20 pequenos passos suaves
      
      intervalId = setInterval(() => {
        if (audio.volume - step > 0.02) {
          audio.volume -= step;
        } else {
          audio.volume = 0;
          audio.pause();
          clearInterval(intervalId);
        }
      }, 100); // Executa a cada 100ms (A transição toda dura 2 segundos)

      if (numCanal === 1) fadeInterval1 = intervalId;
      else fadeInterval2 = intervalId;
    }

    function abrirBotaoPad() {
      if (isPadPlaying) abrirModalPadAtivo(currentPadId);
      else abrirModalSelecaoPad();
    }

    function fecharModaisPad(force = false) {
      if (force || event.target.classList.contains('modal-pad-overlay')) {
        document.getElementById('modalPadSelecao').classList.remove('ativo');
        document.getElementById('modalPadAtivo').classList.remove('ativo');
      }
    }

    function abrirModalSelecaoPad() {
      const listaHTML = (dadosApp.pads || []).map(pad => `
        <button class="btn-lista-pad" onclick="abrirModalPadAtivo('${pad.id}')">
          <span style="display:flex; align-items:center; gap:8px;">
            <span class="material-icons-round" style="color: #4f46e5;">piano</span> ${pad.nome}
          </span>
          <span class="material-icons-round">chevron_right</span>
        </button>
      `).join('');
      
      document.getElementById('listaPadsModal').innerHTML = listaHTML || '<p style="text-align:center; font-size:13px; color:#64748b;">Nenhum Pad cadastrado no Admin.</p>';
      document.getElementById('modalPadSelecao').classList.add('ativo');
    }

    function abrirModalPadAtivo(padId) {
      document.getElementById('modalPadSelecao').classList.remove('ativo');
      const pad = (dadosApp.pads || []).find(p => p.id === padId);
      if (!pad) return;

      document.getElementById('nomePadAtivoUI').innerText = pad.nome;
      document.getElementById('sliderVolumePad').value = padGlobalVolume;

      const gridHtml = TONS_PAD.map(tom => {
        const link = pad.links ? pad.links[tom] : '';
        const hasAudio = !!link;
        const isTocandoEsse = (isPadPlaying && currentPadId === padId && currentPadTom === tom);
        
        return `
          <button class="btn-tom-pad ${isTocandoEsse ? 'ativo' : ''}" 
                  ${!hasAudio ? 'style="opacity:0.3; cursor:not-allowed;" title="Sem áudio"' : ''} 
                  onclick="${hasAudio ? `tocarTomPad('${pad.id}', '${tom}')` : ''}">
            ${tom}
          </button>
        `;
      }).join('');

      document.getElementById('gridTonsPad').innerHTML = gridHtml;
      
      const btnPill = document.getElementById('btnPillPad');
      if (btnPill) {
        if (isPadPlaying) btnPill.classList.add('pad-btn-ativo');
        else btnPill.classList.remove('pad-btn-ativo');
      }

      document.getElementById('modalPadAtivo').classList.add('ativo');
    }

    function tocarTomPad(padId, tom) {
      const pad = (dadosApp.pads || []).find(p => p.id === padId);
      if (!pad || !pad.links[tom]) return;

      const urlOriginal = pad.links[tom];
      const urlDireta = obterLinkDireto(urlOriginal);

      if (isPadPlaying && currentPadId === padId && currentPadTom === tom) return; // Já está tocando esse

      // Escolhe o canal que está livre para o novo áudio
      let novoCanal = canalAtivo === 1 ? 2 : 1;
      let audioAtual = canalAtivo === 1 ? audioPad1 : audioPad2;
      let audioNovo = novoCanal === 1 ? audioPad1 : audioPad2;

      // Se já tinha algo tocando, abaixa o volume suavemente (Fade Out)
      if (isPadPlaying) {
        fazerFadeOut(audioAtual, canalAtivo);
      }

      // Previne que o novo canal sofra com um fade antigo
      let intervalNovo = novoCanal === 1 ? fadeInterval1 : fadeInterval2;
      if (intervalNovo) clearInterval(intervalNovo);

      // Inicia o novo Pad no volume selecionado
      audioNovo.src = urlDireta;
      audioNovo.volume = padGlobalVolume;
      
      audioNovo.play().then(() => {
        isPadPlaying = true;
        currentPadId = padId;
        currentPadTom = tom;
        canalAtivo = novoCanal; // Oficializa a troca de canal
        abrirModalPadAtivo(padId); 
      }).catch(err => {
        alert('Erro ao reproduzir o Pad.');
        console.error(err);
      });
    }

    function ajustarVolumePadGlobal(volumeStr) {
      padGlobalVolume = parseFloat(volumeStr);
      if (isPadPlaying) {
        let audioAtivo = canalAtivo === 1 ? audioPad1 : audioPad2;
        audioAtivo.volume = padGlobalVolume;
      }
    }

    function pararPad() {
      if (!isPadPlaying) return;

      let audioAtivo = canalAtivo === 1 ? audioPad1 : audioPad2;
      
      // Ao invés de pausar seco, chama o fade out suavemente
      fazerFadeOut(audioAtivo, canalAtivo);

      isPadPlaying = false;
      currentPadId = null;
      currentPadTom = null;
      
      fecharModaisPad(true);
      const btnPill = document.getElementById('btnPillPad');
      if (btnPill) btnPill.classList.remove('pad-btn-ativo');
    }

    // ==========================================
    // CÓDIGO ORIGINAL (Menu, Busca, Transposição, Prática)
    // ==========================================

    function abrirModal() { document.getElementById('modalAdmin').classList.add('ativo'); document.getElementById('inputSenhaAdmin').focus(); }
    function fecharModal() { document.getElementById('modalAdmin').classList.remove('ativo'); document.getElementById('inputSenhaAdmin').value = ''; }
    function tratarEnterModal(e) { if(e.key === 'Enter') verificarSenhaAdmin(); }
    function verificarSenhaAdmin() {
      if (document.getElementById('inputSenhaAdmin').value === '10022006') {
        sessionStorage.setItem('adminAutenticado', 'true');
        window.location.href = 'admin.html';
      } else { alert('Senha incorreta!'); document.getElementById('inputSenhaAdmin').value = ''; }
    }

    async function carregarDados() {
      const salvoLocalmente = localStorage.getItem('dadosCifras');
      try {
        if (salvoLocalmente) {
          let parsed = JSON.parse(salvoLocalmente);
          dadosApp = Array.isArray(parsed) ? { cifras: parsed, galeria: [], pads: [] } : { pads: [], ...parsed };
          navegar();
          return;
        }
        const timestampCache = new Date().getTime();
        const resposta = await fetch('backup.json?nocache=' + timestampCache);
        if (!resposta.ok) throw new Error('Falha HTTP');
        
        let json = await resposta.json();
        dadosApp = Array.isArray(json) ? { cifras: json, galeria: [], pads: [] } : { pads: [], ...json };

        localStorage.setItem('dadosCifras', JSON.stringify(dadosApp));
        navegar();
      } catch (erro) {
        if (salvoLocalmente) {
          let parsed = JSON.parse(salvoLocalmente);
          dadosApp = Array.isArray(parsed) ? { cifras: parsed, galeria: [], pads: [] } : { pads: [], ...parsed };
          navegar();
        } else {
          document.getElementById('app').innerHTML = '<p style="text-align: center; color: #6b7280; margin-top: 40px;">Sem conexão com a internet.</p>';
        }
      }
    }

    // (Funções de Prática mantidas)
    let audioPraticaObj = null; let isDraggingPratica = false;
    function formatarTempoPratica(s) { if(isNaN(s)||s<0)return"00:00"; const m=Math.floor(s/60); const sc=Math.floor(s%60); return `${m.toString().padStart(2,'0')}:${sc.toString().padStart(2,'0')}`; }
    function carregarAudioPratica(event) {
      const file = event.target.files[0]; if (!file) return;
      if (audioPraticaObj) { audioPraticaObj.pause(); URL.revokeObjectURL(audioPraticaObj.src); }
      audioPraticaObj = new Audio(URL.createObjectURL(file)); audioPraticaObj.preservesPitch = true;
      document.getElementById('nomeAudioPratica').innerText = file.name;
      document.getElementById('btnAbrirPratica').style.display = 'none';
      document.getElementById('containerPlayerPratica').style.display = 'block';
      audioPraticaObj.addEventListener('loadedmetadata', () => { document.getElementById('tempoTotalPratica').innerText = formatarTempoPratica(audioPraticaObj.duration); document.getElementById('sliderPratica').max = 100; });
      audioPraticaObj.addEventListener('timeupdate', () => { if (!isDraggingPratica) { document.getElementById('tempoAtualPratica').innerText = formatarTempoPratica(audioPraticaObj.currentTime); let p = (audioPraticaObj.currentTime / audioPraticaObj.duration) * 100 || 0; document.getElementById('sliderPratica').value = p; } });
      audioPraticaObj.addEventListener('ended', () => { document.getElementById('iconPlayPratica').innerText = 'play_arrow'; });
    }
    function togglePlayPratica() { if(!audioPraticaObj)return; if(audioPraticaObj.paused){ audioPraticaObj.play(); document.getElementById('iconPlayPratica').innerText='pause'; }else{ audioPraticaObj.pause(); document.getElementById('iconPlayPratica').innerText='play_arrow'; } }
    function pularTempoPratica(s) { if(audioPraticaObj) audioPraticaObj.currentTime = Math.max(0, Math.min(audioPraticaObj.duration, audioPraticaObj.currentTime + s)); }
    function mudarVelocidadePratica(v) { if(audioPraticaObj) audioPraticaObj.playbackRate = parseFloat(v); }
    function arrastandoPratica(v) { isDraggingPratica = true; if(audioPraticaObj) document.getElementById('tempoAtualPratica').innerText = formatarTempoPratica((v/100)*audioPraticaObj.duration); }
    function soltouPratica(v) { isDraggingPratica = false; if(audioPraticaObj) audioPraticaObj.currentTime = (v/100)*audioPraticaObj.duration; }
    function fecharPlayerPratica() {
      if (audioPraticaObj) { audioPraticaObj.pause(); URL.revokeObjectURL(audioPraticaObj.src); audioPraticaObj = null; }
      const c = document.getElementById('containerPlayerPratica'); const b = document.getElementById('btnAbrirPratica'); const i = document.getElementById('inputAudioPratica');
      if(c) c.style.display = 'none'; if(b) b.style.display = 'flex'; if(i) i.value = '';
    }

    // Transposição mantida (C, C#, D...)
    const NOTAS = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    function normalizarNota(n) { const mb={'Db':'C#','Eb':'D#','Gb':'F#','Ab':'G#','Bb':'A#'}; return mb[n]||n; }
    function normalizarHtmlLinhas(html) { 
      if (!html) return '';
      return html
        // Limpa blocos de linha vazia gerados por navegadores diferentes
        .replace(/<div[^>]*><br><\/div>/gi, '\n')
        .replace(/<p[^>]*><br><\/p>/gi, '\n')
        // Transforma qualquer abertura de bloco (mesmo com estilo invisível) em quebra de linha
        .replace(/<div[^>]*>/gi, '\n')
        .replace(/<p[^>]*>/gi, '\n')
        // Remove os fechamentos
        .replace(/<\/div>/gi, '')
        .replace(/<\/p>/gi, '')
        // Converte quebras manuais e garante a identação dos espaços
        .replace(/<br\s*\/?>/gi, '\n')
        .replace(/&nbsp;/g, ' ') 
        // Remove espaços/quebras extras que sobram no topo da música
        .replace(/^\n+/, ''); 
    }
    function transporNotaUnica(n, st) { let nn=normalizarNota(n); let idx=NOTAS.indexOf(nn); if(idx===-1)return n; let nIdx=(idx+st)%12; if(nIdx<0)nIdx+=12; return NOTAS[nIdx]; }
    function transporElementoAcorde(ac, st) { return ac.replace(/[A-G][b#]?/g, m=>transporNotaUnica(m,st)); }
    function transporCifra(txt, st) {
      const tn = normalizarHtmlLinhas(txt); const RE = /^[A-G][b#]?(?:m|M|maj|min|dim|aug|sus|add|º|°|\+|-)?\d*(?:M|m|maj|b5|#5|b9|#9|\+|-)?(?:\([^\)]+\))?(?:\/[A-G][b#]?)?$/i; const AMB=new Set(['A','E','B','EM','AM']);
      return tn.split('\n').map(linha => {
        if (!linha.trim()) return linha;
        const pals = linha.trim().split(/\s+/); let aI=0, aA=0, pT=0;
        pals.forEach(p => { let sh = p.replace(/<[^>]*>/g,''); let l = sh.replace(/^[^\w#bº°\+]+|[^\w#bº°\+]+$/gi,''); if(!l)return; if(/^[\d\-|\/\.\,\:\(\)\+º°]+$/.test(l) || /^\(?\d+x\)?$/i.test(l) || sh.endsWith(':'))return; if(/^(intro|introdução|passagem|solo|interlúdio|pausa|cresce|diminui|instrumental|piano|teclado|refrão|ponte|final|verso|cifra|base|parte|dedilhado|batida|riff|outro|vamp|tag)$/i.test(l))return; if(RE.test(l)){ if(AMB.has(l.toUpperCase()))aA++; else aI++; }else pT++; });
        if (!((aI+aA)>0 && (pT===0 || aI>pT))) return linha;
        return linha.replace(/(\S+)(\s*)/g, (m, pal, esp) => {
          let sh = pal.replace(/<[^>]*>/g,''); let l = sh.replace(/^[^\w#bº°\+]+|[^\w#bº°\+]+$/gi,'');
          if (RE.test(l) && !/^(intro|introdução|passagem|solo|interlúdio|tribal|pausa|cresce|diminui|instrumental|piano|teclado|refrão|ponte|final|verso|cifra|base|parte|dedilhado|batida|riff|outro|vamp|tag)$/i.test(l) && !sh.endsWith(':')) {
            let i=pal.indexOf(l), c=pal.substring(0,i), f=pal.substring(i+l.length), lt=transporElementoAcorde(l,st);
            let nPal = c+`<span class="acorde">${lt}</span>`+f; let qE = esp.length; if(qE>0 && (lt.length-l.length)>0) qE=Math.max(1, qE-(lt.length-l.length));
            return nPal + ' '.repeat(qE);
          } return m;
        });
      }).join('\n');
    }
    function definirTom(nt) { tomAtual=normalizarNota(nt); const st=calcularDiferenca(musicaTomOriginal,tomAtual); const sT=document.getElementById('selectTom'); if(sT)sT.value=tomAtual; const pc=document.getElementById('cifraConteudo'); if(pc)pc.innerHTML=transporCifra(conteudoOriginal,st); }
    function alterarTom(st) { let i=NOTAS.indexOf(tomAtual); if(i===-1)i=0; let ni=(i+st)%12; if(ni<0)ni+=12; definirTom(NOTAS[ni]); }
    function calcularDiferenca(tO, tN) { let i1=NOTAS.indexOf(normalizarNota(tO)); let i2=NOTAS.indexOf(normalizarNota(tN)); if(i1===-1||i2===-1)return 0; return i2-i1; }
    
    function alternarRolagem() { const b=document.getElementById('btnRolagem'); if(intervalRolagem){ clearInterval(intervalRolagem); intervalRolagem=null; b.innerHTML='<span class="material-icons-round" style="font-size:18px">play_arrow</span> Iniciar'; }else{ b.innerHTML='<span class="material-icons-round" style="font-size:18px">pause</span> Pausar'; iniciarIntervaloRolagem(); } }
    function iniciarIntervaloRolagem() { if(intervalRolagem)clearInterval(intervalRolagem); const v=parseInt(document.getElementById('velocidadeRolagem').value); intervalRolagem=setInterval(()=>window.scrollBy(0,1), 150-(v*1.4)); }
    function atualizarVelocidadeRolagem() { if(intervalRolagem)iniciarIntervaloRolagem(); }
    function alterarFonte(d) { tamanhoFonteAtual=Math.max(10, Math.min(45, tamanhoFonteAtual+d)); const pc=document.getElementById('cifraConteudo'); if(pc)pc.style.fontSize=`${tamanhoFonteAtual}px`; }
    function ajustarZoomAutomatico() { const pE=document.getElementById('cifraConteudo'); if(!pE)return; let s=30; pE.style.fontSize=s+'px'; while(pE.scrollWidth>pE.clientWidth && s>10){ s-=1; pE.style.fontSize=s+'px'; } tamanhoFonteAtual=s; }

    function gerarHtmlListaPastas() {
      const cA = dadosApp.cifras || [];
      let pF = cA.map((p, i) => ({...p, idx: i})).filter(p => p.nome.toLowerCase().includes(termoBuscaAtual));
      return pF.map(p => `<a href="#/pasta/${p.idx}" class="list-card"><div class="card-icon folder"><span class="material-icons-round">folder</span></div><div class="card-content"><h4>${p.nome}</h4><span><span class="material-icons-round" style="font-size: 14px">music_note</span> ${(p.musicas||[]).length} música(s)</span></div><span class="material-icons-round chevron">chevron_right</span></a>`).join('') || '<p style="color: #6b7280; text-align: center; padding: 20px;">Nenhuma pasta encontrada.</p>';
    }
    function renderizarInicio() {
      const cA = dadosApp.cifras || []; let qM = 0; cA.forEach(p => qM += (p.musicas||[]).length);
      return `<div class="search-container"><span class="material-icons-round">search</span><input type="text" placeholder="Buscar por pasta..." oninput="termoBuscaAtual=this.value.toLowerCase(); document.getElementById('listaDinamica').innerHTML=gerarHtmlListaPastas();"></div><div class="stats-container"><div class="stat-card"><span class="material-icons-round icon-bg-folder">folder</span><div class="stat-info"><h3>${cA.length}</h3><span>Pastas</span></div></div><div class="stat-card"><span class="material-icons-round icon-bg-music">music_note</span><div class="stat-info"><h3>${qM}</h3><span>Músicas</span></div></div></div><h3 class="secao-titulo">Pastas de Cifras</h3><div class="lista-grid" id="listaDinamica">${gerarHtmlListaPastas()}</div>`;
    }
    function gerarHtmlListaMusicas(iP) {
      const p = (dadosApp.cifras||[])[iP]; if(!p)return'';
      let mF = (p.musicas||[]).filter(m => m.titulo.toLowerCase().includes(termoBuscaAtual));
      return mF.map(m => `<a href="#/musica/${iP}/${m.id}" class="list-card"><div class="card-icon music"><span class="material-icons-round">music_note</span></div><div class="card-content"><h4>${m.titulo}</h4><span><span class="tag-tom">Tom: ${m.tom||'C'}</span></span></div><span class="material-icons-round chevron">chevron_right</span></a>`).join('') || '<p style="color: #6b7280; text-align: center; padding: 20px;">Nenhuma música encontrada.</p>';
    }
    function renderizarPasta(iP) { const p = (dadosApp.cifras||[])[iP]; if(!p)return '<p>Pasta não encontrada.</p>'; return `<div class="cabecalho-secao"><button class="icon-btn" onclick="window.location.hash='#/'"><span class="material-icons-round">arrow_back</span></button><h2>${p.nome}</h2></div><div class="search-container"><span class="material-icons-round">search</span><input type="text" placeholder="Buscar música nesta pasta..." oninput="termoBuscaAtual=this.value.toLowerCase(); document.getElementById('listaDinamica').innerHTML=gerarHtmlListaMusicas(${iP});"></div><div class="lista-grid" id="listaDinamica">${gerarHtmlListaMusicas(iP)}</div>`; }

    // RENDERIZAÇÃO DA MÚSICA (COM BOTÃO DE PAD ADICIONADO)
    function renderizarMusica(iP, iM) {
      const m = (dadosApp.cifras||[])[iP]?.musicas.find(mu => mu.id === iM); if(!m)return '<p>Música não encontrada.</p>';
      tomAtual = normalizarNota(m.tom || 'C'); musicaTomOriginal = tomAtual; conteudoOriginal = m.conteudo;
      const opT = NOTAS.map(n => `<option value="${n}">${n}</option>`).join('');
      setTimeout(() => { document.getElementById('selectTom').value=tomAtual; definirTom(tomAtual); ajustarZoomAutomatico(); }, 50);

      // Checa se tem pad tocando para deixar o botão verdinho
      let btnPadClass = (isPadPlaying) ? "btn-circular pad-btn-ativo" : "btn-circular";

      return `
        <div class="cabecalho-secao"><button class="icon-btn" onclick="window.location.hash='#/pasta/${iP}'"><span class="material-icons-round">arrow_back</span></button><h2>${m.titulo}</h2></div>
        
        <div class="controles-musica-moderno">
          <div class="linha-controles">
            <div class="controle-pilula"><span class="label">Tom</span><button class="btn-circular" onclick="alterarTom(-1)">-</button><select id="selectTom" class="select-invisivel" onchange="definirTom(this.value)">${opT}</select><button class="btn-circular" onclick="alterarTom(1)">+</button></div>
            <div class="controle-pilula"><span class="label">Fonte</span><button class="btn-circular" onclick="alterarFonte(-2)">A-</button><button class="btn-circular" onclick="alterarFonte(2)">A+</button></div>
            
            <!-- NOVO BOTÃO DE PAD NA INTERFACE -->
            <div class="controle-pilula">
              <span class="label">Pad</span>
              <button class="${btnPadClass}" id="btnPillPad" onclick="abrirBotaoPad()">
                <span class="material-icons-round" style="font-size: 18px;">keyboard</span>
              </button>
            </div>
            <!-- =============================== -->

          </div>
          <div class="controle-rolagem-container"><button id="btnRolagem" class="btn-iniciar-rolagem" onclick="alternarRolagem()"><span class="material-icons-round" style="font-size:18px">play_arrow</span> Iniciar</button><input type="range" id="velocidadeRolagem" class="slider-moderno" min="1" max="100" value="30" oninput="atualizarVelocidadeRolagem()"></div>
        </div>

        <button class="btn btn-secondary" id="btnAbrirPratica" style="width: 100%; margin-top: 15px; font-size: 14px; background: #e0e7ff; color: #4f46e5; border: 1px dashed #a5b4fc;" onclick="document.getElementById('inputAudioPratica').click()"><span class="material-icons-round" style="font-size: 20px;">headphones</span> Carregar Áudio</button>
        <input type="file" id="inputAudioPratica" accept="audio/*" style="display: none;" onchange="carregarAudioPratica(event)">
        <div class="player-pratica-container" id="containerPlayerPratica" style="display: none;"><div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;"><div style="display: flex; align-items: center; gap: 6px; overflow: hidden;"><span class="material-icons-round" style="color: #64748b; font-size: 18px;">music_note</span><span id="nomeAudioPratica" style="font-size: 13px; font-weight: 600; color: #334155; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">Áudio</span></div><button class="icon-btn" style="color: #ef4444; padding: 4px;" onclick="fecharPlayerPratica()"><span class="material-icons-round" style="font-size: 18px;">close</span></button></div><div class="player-acoes"><div class="player-botoes"><button class="btn-acao-audio" onclick="pularTempoPratica(-5)"><span class="material-icons-round" style="font-size: 18px;">replay_5</span></button><button class="btn-play-principal" onclick="togglePlayPratica()"><span class="material-icons-round" id="iconPlayPratica">play_arrow</span></button><button class="btn-acao-audio" onclick="pularTempoPratica(5)"><span class="material-icons-round" style="font-size: 18px;">forward_5</span></button></div><div style="background: white; border: 1px solid #cbd5e1; border-radius: 8px; padding: 2px 6px;"><select class="select-invisivel" style="font-size: 12px; font-weight: 600; color: #334155; width: auto;" onchange="mudarVelocidadePratica(this.value)"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1.0x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option></select></div></div><div class="player-timeline"><span class="tempo-audio" id="tempoAtualPratica">00:00</span><input type="range" id="sliderPratica" class="slider-moderno" style="flex: 1; height: 6px;" min="0" max="100" value="0" step="0.1" oninput="arrastandoPratica(this.value)" onchange="soltouPratica(this.value)"><span class="tempo-audio" id="tempoTotalPratica">00:00</span></div></div>
        <pre id="cifraConteudo" style="font-size: ${tamanhoFonteAtual}px;"></pre>
      `;
    }

    function navegar() {
      if (intervalRolagem) { clearInterval(intervalRolagem); intervalRolagem = null; }
      fecharPlayerPratica(); 
      termoBuscaAtual = ''; 
      const hash = window.location.hash;
      const app = document.getElementById('app');

      // Nota: o Pad NÃO é interrompido ao sair da cifra, ele continua tocando de fundo até o usuário pará-lo manualmente.
      
      if (!hash || hash === '#/') app.innerHTML = renderizarInicio();
      else if (hash.startsWith('#/pasta/')) app.innerHTML = renderizarPasta(hash.split('/')[2]);
      else if (hash.startsWith('#/musica/')) app.innerHTML = renderizarMusica(hash.split('/')[2], hash.split('/')[3]);
    }
    window.addEventListener('hashchange', navegar);
    carregarDados();
  </script>
</body>
</html>
